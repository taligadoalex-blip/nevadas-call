name: Build NEVADAS CALL for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Gerar NEVADAS CALL Portable.exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Enviar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: NEVADAS-CALL-Windows-x64
          path: dist/NEVADAS CALL Portable.exe
          if-no-files-found: error
